name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sdl3:

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
      with:
         submodules: recursive
    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
    - name: Build
      run: | 
          cd SDL
          cmake -S . -B build 
          cmake --build build 
          sudo cmake --install build --prefix /usr/local/sdl3
    - name: Move so sdl files to respective folders
      run: |
        cd "$GITHUB_WORKSPACE"
        mkdir -p "$GITHUB_WORKSPACE/lib/sdl3"
        mkdir -p "$GITHUB_WORKSPACE/target/debug/"
        sudo mv /usr/local/sdl3/lib/* "$GITHUB_WORKSPACE/lib/" 
        ls "$GITHUB_WORKSPACE/lib" 
        sudo mv "$GITHUB_WORKSPACE"/lib/*.so.* "$GITHUB_WORKSPACE/target/debug/"

        
  test-server:

    runs-on: ubuntu-24.04-arm
    needs: build-sdl3

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --bin server --verbose
    - name: Run tests
      run: cargo test --bin server --verbose
      
  test-client:

    runs-on: ubuntu-24.04-arm
    needs: build-sdl3

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --bin client --verbose
    - name: Run tests
      run: cargo test --bin client --verbose

